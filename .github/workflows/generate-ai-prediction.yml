name: Generate AI Prediction

on:
  schedule:
    # 开奖后 35 分钟：北京时间 22:00 (UTC 14:00)
    # 确保 update-lottery-data (21:40) 已完成，数据已更新
    # 大乐透每周一/三/六开奖，非开奖日运行无新数据会自动跳过
    - cron: '0 14 * * *'
  workflow_dispatch: # 也支持手动触发

jobs:
  generate-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run statistical/ML models
        run: python3 -m strategies.runner

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ai_predictions.json data/predictions_history.json
          git commit -m "chore: generate AI predictions $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Summary
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "✅ AI predictions generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ No changes in prediction data" >> $GITHUB_STEP_SUMMARY
